# Pipeline keselamatan untuk Kedai Bengkel (GitLab CI/CD).
# Simpan sebagai .gitlab-ci.yml di akar repo.
#
# Pembolehubah projek (Settings > CI/CD > Variables):
#   APP_DIR            aspnet-app  atau  laravel-app   (jika tiada, lalai di bawah)
#   HARBOR_USER        contoh: robot$peserta03+ci       (jenis Variable)
#   HARBOR_PASSWORD    rahsia robot account Harbor       (Masked)
#   HARBOR_PROJECT     contoh: peserta03
#   HARBOR_CA          kandungan ca.crt                  (jenis File)
#   COSIGN_PRIVATE_KEY kunci cosign.key                  (jenis File)
#   COSIGN_PASSWORD    kata laluan kunci cosign          (Masked)
#
# Runner mesti menggunakan executor Docker dan boleh mencapai harbor.lab.test.
# Job `imej` memasang soket Docker pada kontena job (lihat Modul 6): ia memberi
# job kuasa penuh ke atas Docker hos, jadi runner begini hanya wajar untuk makmal.

stages: [imbas, imej]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  APP_DIR: aspnet-app
  HARBOR: harbor.lab.test
  GIT_DEPTH: "0"                 # Gitleaks perlu sejarah git penuh
  SEMGREP_SEND_METRICS: "off"

default:
  timeout: 15m
  interruptible: true

# --- Peringkat 1: imbasan kod. Empat job berjalan selari. ---

secret-detection:
  stage: imbas
  image: { name: "zricethezav/gitleaks:v8.30.1", entrypoint: [""] }
  variables:
    # Clone baharu setiap kali. Folder kerja yang digunakan semula menyimpan rujukan lama (refs/pipelines/*)
    # yang masih menunjuk ke commit yang sudah dibuang daripada cawangan; `gitleaks git` mengimbas semua rujukan.
    GIT_STRATEGY: clone
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - BASELINE=""
    - '[ -f gitleaks-baseline.json ] && BASELINE="--baseline-path gitleaks-baseline.json"'
    - gitleaks git . --no-banner --redact $BASELINE

sast:
  stage: imbas
  image: { name: "semgrep/semgrep:1.183.0", entrypoint: [""] }
  script:
    - semgrep scan --quiet --config p/default --config p/gitlab --config p/phpcs-security-audit --severity ERROR --error "$APP_DIR"

sca:
  stage: imbas
  image: { name: "aquasec/trivy:0.76.2", entrypoint: [""] }
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$APP_DIR"

iac:
  stage: imbas
  image: { name: "aquasec/trivy:0.76.2", entrypoint: [""] }
  script:
    - for d in "$APP_DIR" k8s terraform; do trivy config --severity HIGH,CRITICAL --exit-code 1 "$d" || FAIL=1; done
    - test -z "$FAIL"

# --- Peringkat 2: imej. Hanya pada cabang lalai, selepas semua imbasan lulus. ---

imej:
  stage: imej
  image: docker:29-cli
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 30m
  variables:
    # cosign v3.1.4
    COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d
    SSL_CERT_FILE: $HARBOR_CA
  before_script:
    - apk add --no-cache curl python3 >/dev/null
    - IMG="$HARBOR/$HARBOR_PROJECT/$APP_DIR:${CI_COMMIT_SHORT_SHA}"
  script:
    - docker buildx build --provenance=false --sbom=false --load -t "$IMG" "$APP_DIR"
    # Imbas imej: gagal jika ada Critical
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --severity CRITICAL --exit-code 1 "$IMG"
    # Jana SBOM (CycloneDX). Jangan guna `-v "$PWD":...`: soket Docker milik hos, jadi laluan itu merujuk folder hos, bukan folder job.
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --quiet --format cyclonedx "$IMG" > sbom.cdx.json
    - test -s sbom.cdx.json
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR" -u "$HARBOR_USER" --password-stdin
    - docker push "$IMG"
    # Harbor menyekat imej yang belum diimbas: tunggu imbasannya siap sebelum menandatangani
    - |
      for _ in $(seq 1 40); do
        S=$(curl -s -u "$HARBOR_USER:$HARBOR_PASSWORD" "https://$HARBOR/api/v2.0/projects/$HARBOR_PROJECT/repositories/$APP_DIR/artifacts/$CI_COMMIT_SHORT_SHA?with_scan_overview=true" \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); o=list(d.get("scan_overview",{}).values()); print(o[0]["scan_status"] if o else "none")')
        echo "imbasan Harbor: $S"
        [ "$S" = "Success" ] && break
        sleep 5
      done
      [ "$S" = "Success" ]
    # Ambil cosign daripada imejnya, dikunci pada digest (tidak bergantung pada muat turun fail dari GitHub)
    - C=$(docker create "$COSIGN_IMAGE")
    - docker cp "$C:/ko-app/cosign" /usr/local/bin/cosign
    - docker rm "$C"
    # Tandatangan format lama (tag .sig) supaya Kyverno 1.19 dapat mengesahkannya
    - DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMG")
    - REF="${IMG%:*}@$DIGEST"
    - cosign sign --key "$COSIGN_PRIVATE_KEY" --yes --new-bundle-format=false --use-signing-config=false "$REF"
    - cosign attest --key "$COSIGN_PRIVATE_KEY" --type cyclonedx --predicate sbom.cdx.json --yes "$REF"

</style><defs><marker id="smh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="sma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="10" y="20" width="560" height="350" rx="14" class="zone2"/><text x="26" y="46" class="tl" text-anchor="start">Laptop peserta (Docker Desktop · WSL2)</text><rect x="30" y="70" width="250" height="60" rx="8" class="warn"/><text x="155.0" y="97.0" class="th" text-anchor="middle">App lab</text><text x="155.0" y="115.0" class="ts" text-anchor="middle">aspnet-app atau laravel-app</text><rect x="300" y="70" width="250" height="60" rx="8" class="acc"/><text x="425.0" y="97.0" class="th" text-anchor="middle">Kontena imbasan</text><text x="425.0" y="115.0" class="ts" text-anchor="middle">gitleaks · trivy · semgrep · zap</text><rect x="30" y="160" width="520" height="130" rx="10" class="zone"/><text x="46" y="186" class="th" text-anchor="start">Kluster k3d (satu node, untuk Hari 4)</text><rect x="50" y="202" width="140" height="60" rx="8" class="box"/><text x="120.0" y="229.0" class="th" text-anchor="middle">Kyverno</text><text x="120.0" y="247.0" class="ts" text-anchor="middle">dasar admission</text><rect x="210" y="202" width="140" height="60" rx="8" class="okb"/><text x="280.0" y="229.0" class="th" text-anchor="middle">Pod app</text><text x="280.0" y="247.0" class="ts" text-anchor="middle">securityContext</text><rect x="370" y="202" width="160" height="60" rx="8" class="box"/><text x="450.0" y="229.0" class="th" text-anchor="middle">NetworkPolicy</text><text x="450.0" y="247.0" class="ts" text-anchor="middle">deny by default</text><rect x="30" y="310" width="520" height="44" rx="8" class="box"/><text x="46" y="337" class="ts m" text-anchor="start">hosts: 192.53.174.104 harbor.lab.test · CA lab dipercayai</text><re
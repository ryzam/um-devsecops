<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="rbt rbd"><title id="rbt">Rantaian bekalan perisian</title><desc id="rbd">Kod dibina oleh CI, SBOM dijana, image ditandatangani dengan cosign, disimpan di Harbor dan disahkan oleh Kyverno sebelum pod dibenarkan berjalan.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="rbh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="rba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="8" y="70" width="112" height="64" rx="8" class="box"/><text x="64.0" y="99.0" class="th" text-anchor="middle">Kod</text><text x="64.0" y="117.0" class="ts" text-anchor="middle">git commit</text><rect x="134" y="70" width="112" height="64" rx="8" class="box"/><text x="190.0" y="99.0" class="th" text-anchor="middle">CI</text><text x="190.0" y="117.0" class="ts" text-anchor="middle">build + scan</text><path d="M120,102 H133" class="arr" marker-end="url(#rbh)"/><rect x="260" y="70" width="112" height="64" rx="8" class="acc"/><text x="316.0" y="99.0" class="th" text-anchor="middle">SBOM</text><text x="316.0" y="117.0" class="ts" text-anchor="middle">senarai komponen</text><path d="M246,102 H259" class="arr" marker-end="url(#rbh)"/><rect x="386" y="70" width="112" height="64" rx="8" class="acc"/><text x="442.0" y="99.0" class="th" text-anchor="middle">Tandatangan</text><text x="442.0" y="117.0" class="ts" text-anchor="middle">cosign sign</text><path d="M372,102 H385" class="arr" marker-end="url(#rbh)"/><rect x="512" y="70" width="112" height="64" rx="8" class="box"/><text x="568.0" y="99.0" class="th" text-anchor="middle">Harbor</text><text x="568.0" y="117.0" class="ts" text-anchor="middle">registry</text><path d="M498,102 H511" class="arr" marker-end="url(#rbh)"/><rect x="638" y="70" width="112" height="64" rx="8" class="acc"/><text x="694.0" y="99.0" class="th" text-anchor="middle">Kyverno</text><text x="694.0" y="117.0" class="ts" text-anchor="middle">verify tandatangan</text><path d="M624,102 H637" class="arr" marker-end="url(#rbh)"/><rect x="764" y="70" width="112" height="64" rx="8" class="box"/><text x="820.0" y="99.0" class="th" text-anchor="middle">Pod</text><text x="820.0" y="117.0" class="ts" text-anchor="middle">berjalan</text><path d="M750,102 H763" class="arr" marker-end="url(#rbh)"/><text x="10" y="34" class="ts" text-anchor="start">Setiap peringkat menambah bukti; peringkat terakhir menolak apa-apa yang tiada bukti.</text><rect x="10" y="164" width="880" height="48" rx="8" class="zone"/><text x="26" y="193" class="ts" text-anchor="start">Tanpa tandatangan, sesiapa yang boleh push ke registry boleh menjalankan kod di kluster anda.</text></svg>
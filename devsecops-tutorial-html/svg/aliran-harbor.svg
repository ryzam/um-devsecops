.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="10" y="14" width="880" height="44" rx="8" class="zone"/><text x="26" y="41" class="ts" text-anchor="start">Perhatian: binaan Docker lalai menambah attestation (OCI index) dan polisi tidak berkuat kuasa. Gunakan --provenance=false.</text><rect x="10" y="90" width="120" height="64" rx="8" class="box"/><text x="70.0" y="119.0" class="th" text-anchor="middle">docker build</text><text x="70.0" y="137.0" class="ts" text-anchor="middle">provenance=false</text><rect x="170" y="90" width="120" height="64" rx="8" class="box"/><text x="230.0" y="119.0" class="th" text-anchor="middle">docker push</text><text x="230.0" y="137.0" class="ts" text-anchor="middle">ke peserta01/</text><rect x="330" y="90" width="140" height="64" rx="8" class="acc"/><text x="400.0" y="119.0" class="th" text-anchor="middle">Harbor simpan</text><text x="400.0" y="137.0" class="ts" text-anchor="middle">projek peserta01</text><rect x="510" y="90" width="130" height="64" rx="8" class="acc"/><text x="575.0" y="119.0" class="th" text-anchor="middle">Trivy imbas</text><text x="575.0" y="137.0" class="ts" text-anchor="middle">automatik</text><rect x="680" y="90" width="130" height="64" rx="8" class="warn"/><text x="745.0" y="119.0" class="th" text-anchor="middle">Polisi</text><text x="745.0" y="137.0" class="ts" text-anchor="middle">ambang High</text><path d="M130,122 H168" class="arr" marker-end="url(#ahh)"/><path d="M290,122 H328" class="arr" marker-end="url(#ahh)"/><path d="M470,122 H508" class="arr" marker-end="url(#ahh)"/><path d="M640,122 H678" class="arr" marker-end="url(#ahh)"/><path d="M745,154 V196" class="arr" marker-end="url(#ahh)"/><path d="M745,196 H640" class="arr" marker-end="url(#ahh)"/><rect x="470" y="196" width="170" height="64" rx="8" class="warn"/><text x="555.0" y="225.0" class="th" text-anchor="middle">Pull ditolak</text><text x="555.0" y="243.0" class="ts" text-anchor="middle">HTTP 412 Precondition Failed</text><path d="M810,122 H860 V228 H842" class="arr" marker-end="url(#ahh)"/><rect x="690" y="196" width="150" height="64" rx="8" class="okb"/><text x="765.0" y="225.0" class="th" text-anchor="middle">Pull dibenarkan</text><text x="765.0" y="243.0" class="ts" text-anchor="middle">tiada High / Critical</text></svg>
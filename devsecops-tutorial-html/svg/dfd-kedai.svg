<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="dft dfd"><title id="dft">Gambar rajah aliran data Kedai Bengkel</title><desc id="dfd">Pengguna dan admin berada di luar sempadan kepercayaan; app web berada di dalam server bersama pangkalan data SQLite, proses OS untuk ping dan folder files. Setiap aliran data diberi tag ancaman STRIDE.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="dfh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="dfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="10" y="30" width="200" height="400" rx="12" class="zone2"/><text x="26" y="56" class="tl" text-anchor="start">Di luar kepercayaan</text><rect x="270" y="30" width="620" height="400" rx="12" class="zone"/><text x="286" y="56" class="tl" text-anchor="start">Server (sempadan kepercayaan)</text><rect x="30" y="120" width="160" height="64" rx="8" class="box"/><text x="110.0" y="149.0" class="th" text-anchor="middle">Pengguna</text><text x="110.0" y="167.0" class="ts" text-anchor="middle">pelayar</text><rect x="30" y="290" width="160" height="64" rx="8" class="box"/><text x="110.0" y="319.0" class="th" text-anchor="middle">Admin</text><text x="110.0" y="337.0" class="ts" text-anchor="middle">cookie sesi</text><rect x="310" y="180" width="200" height="100" rx="8" class="acc"/><text x="410.0" y="227.0" class="th" text-anchor="middle">App Kedai Bengkel</text><text x="410.0" y="245.0" class="ts" text-anchor="middle">/search /login /guestbook</text><rect x="690" y="80" width="180" height="56" rx="8" class="box"/><text x="780.0" y="105.0" class="th" text-anchor="middle">Pangkalan data</text><text x="780.0" y="123.0" class="ts" text-anchor="middle">SQLite</text><rect x="690" y="200" width="180" height="56" rx="8" class="box"/><text x="780.0" y="225.0" class="th" text-anchor="middle">Proses OS</text><text x="780.0" y="243.0" class="ts" text-anchor="middle">ping -c 1 host</text><rect x="690" y="320" width="180" height="56" rx="8" class="box"/><text x="780.0" y="345.0" class="th" text-anchor="middle">Sistem fail</text><text x="780.0" y="363.0" class="ts" text-anchor="middle">files/notis.txt</text><path d="M190,152 H250 V210 H308" class="arra" marker-end="url(#dfa)"/><text x="250" y="108" class="tw" text-anchor="middle">S · T · R</text><text x="250" y="94" class="ts" text-anchor="middle">XSS, tiada CSRF</text><path d="M190,322 H250 V252 H308" class="arr" marker-end="url(#dfh)"/><text x="250" y="366" class="tw" text-anchor="middle">S · E</text><text x="250" y="382" class="ts" text-anchor="middle">cookie dipalsukan</text><path d="M510,200 H560 V108 H688" class="arra" marker-end="url(#dfa)"/><text x="600" y="96" class="tw" text-anchor="middle">T · I: SQL injection</text><path d="M510,230 H688" class="arra" marker-end="url(#dfa)"/><text x="600" y="222" class="tw" text-anchor="middle">E: command injection</text><path d="M510,262 H560 V348 H688" class="arra" marker-end="url(#dfa)"/><text x="600" y="340" class="tw" text-anchor="middle">I: path traversal</text><text x="30" y="416" class="ts" text-anchor="start">S spoofing · T tampering · R repudiation · I information disclosure · D denial of service · E elevation of privilege</text></svg>
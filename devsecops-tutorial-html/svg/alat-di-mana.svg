<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" role="img" aria-labelledby="adt add"><title id="adt">Alat di laptop pembangun dan alat di server</title><desc id="add">Laptop pembangun menjalankan git, pre-commit hook Gitleaks, kontena imbasan melalui alat.sh, app lab dan kluster k3d. Selepas git push ke GitLab di server Linode, GitLab Runner menjalankan job imbasan dan binaan imej, menolak imej ke Harbor dan menandatanganinya. Harbor juga mengimbas imej dengan Trivy dan menguatkuasakan polisi.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="adh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="10" y="20" width="410" height="484" rx="14" class="zone2"/><text x="26" y="46" class="tl" text-anchor="start">Laptop anda · Windows + WSL2 + Docker Desktop</text><rect x="30" y="64" width="370" height="56" rx="8" class="box"/><text x="215.0" y="89.0" class="th" text-anchor="middle">Git</text><text x="215.0" y="107.0" class="ts" text-anchor="middle">git · identiti · remote gitlab</text><rect x="30" y="134" width="370" height="56" rx="8" class="acc"/><text x="215.0" y="159.0" class="th" text-anchor="middle">Pre-commit hook</text><text x="215.0" y="177.0" class="ts" text-anchor="middle">Gitleaks menyekat commit yang ada secret</text><rect x="30" y="204" width="370" height="92" rx="8" class="acc"/><text x="215" y="228" class="th" text-anchor="middle">Kontena imbasan (fungsi dalam alat.sh)</text><text x="215" y="252" class="ts m" text-anchor="middle">gitleaks · semgrep · trivy · checkov</text><text x="215" y="270" class="ts m" text-anchor="middle">hadolint · kube-linter · zap · cosign</text><text x="215" y="288" class="ts" text-anchor="middle">dijalankan oleh anda, bila-bila masa</text><rect x="30" y="310" width="370" height="56" rx="8" class="warn"/><text x="215.0" y="335.0" class="th" text-anchor="middle">App lab</text><text x="215.0" y="353.0" class="ts" text-anchor="middle">aspnet-app atau laravel-app dalam Docker</text><rect x="30" y="380" width="370" height="56" rx="8" class="box"/><text x="215.0" y="405.0" class="th" text-anchor="middle">Kluster k3d</text><text x="215.0" y="423.0" class="ts" text-anchor="middle">kubectl · Kyverno · NetworkPolicy (Hari 4)</text><rect x="30" y="450" width="370" height="40" rx="8" class="box"/><text x="215.0" y="475.0" class="t" text-anchor="middle">Threat Dragon (pilihan, Windows)</text><rect x="520" y="20" width="370" height="484" rx="14" class="zone"/><text x="536" y="46" class="tl" text-anchor="start">Server Linode · dikongsi, instruktur sediakan</text><rect x="540" y="64" width="330" height="64" rx="8" class="acc"/><text x="705.0" y="93.0" class="th" text-anchor="middle">GitLab</text><text x="705.0" y="111.0" class="ts" text-anchor="middle">repo + CI/CD · gitlab.lab.test:8929</text><rect x="540" y="152" width="330" height="176" rx="8" class="box"/><text x="556" y="178" class="th" text-anchor="start">GitLab Runner (Docker)</text><text x="556" y="202" class="ts" text-anchor="start">job imbas:</text><text x="556" y="220" class="ts m" text-anchor="start">secret-detection · sast · sca · iac</text><text x="556" y="246" class="ts" text-anchor="start">job imej:</text><text x="556" y="264" class="ts m" text-anchor="start">build · Trivy imej · SBOM</text><text x="556" y="282" class="ts m" text-anchor="start">push ke Harbor · cosign sign</text><text x="556" y="312" class="ts" text-anchor="start">alat sama seperti di laptop, berjalan secara automatik</text><rect x="540" y="352" width="330" height="64" rx="8" class="acc"/><text x="705.0" y="381.0" class="th" text-anchor="middle">Harbor</text><text x="705.0" y="399.0" class="ts" text-anchor="middle">registry + Trivy + polisi · harbor.lab.test:443</text><text x="556" y="444" class="ts" text-anchor="start">Jika memilih GitHub Actions, runner dihoskan</text><text x="556" y="462" class="ts" text-anchor="start">oleh GitHub dan bukan di Linode; Harbor kekal sama.</text><path d="M400,92 H538" class="arra" marker-end="url(#ada)"/><text x="470" y="82" class="ta" text-anchor="middle">git push</text><text x="470" y="112" class="ts m" text-anchor="middle">HTTPS 8929</text><path d="M705,128 V150" class="arra" marker-end="url(#ada)"/><path d="M705,328 V350" class="arra" marker-end="url(#ada)"/><path d="M400,338 H470 V392 H538" class="arr dash" marker-end="url(#adh)"/><text x="470" y="376" class="ts" text-anchor="middle">docker push</text><text x="470" y="424" class="ts" text-anchor="middle">(Modul 4)</text><rect x="10" y="518" width="880" height="44" rx="8" class="zone"/><text x="26" y="545" class="ts" text-anchor="start">Alat yang sama berjalan di dua tempat: di laptop untuk belajar dan maklum balas pantas, di server sebagai pintu yang tidak boleh dielak.</text></svg>
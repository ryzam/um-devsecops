<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="lht lhd"><title id="lht">Lapisan hardening Kubernetes</title><desc id="lhd">Empat lapisan bersarang: Kyverno di admission, Pod Security Standards pada namespace, securityContext pada pod dan container, dengan NetworkPolicy mengawal trafik antara pod.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="lhh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="lha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="10" y="20" width="880" height="350" rx="14" class="zone2"/><text x="26" y="46" class="th" text-anchor="start">Kluster · Kyverno menolak manifest yang melanggar dasar (admission)</text><rect x="40" y="64" width="820" height="290" rx="12" class="zone"/><text x="56" y="90" class="th" text-anchor="start">Namespace · Pod Security Standards: restricted</text><rect x="70" y="108" width="520" height="230" rx="10" class="box"/><text x="86" y="134" class="th" text-anchor="start">Pod · securityContext</text><rect x="90" y="152" width="230" height="70" rx="8" class="okb"/><text x="205.0" y="184.0" class="th" text-anchor="middle">Container</text><text x="205.0" y="202.0" class="ts" text-anchor="middle">runAsNonRoot · readOnlyRootFilesystem</text><rect x="340" y="152" width="230" height="70" rx="8" class="okb"/><text x="455.0" y="184.0" class="th" text-anchor="middle">Container</text><text x="455.0" y="202.0" class="ts" text-anchor="middle">drop ALL capabilities</text><text x="86" y="258" class="ts m" text-anchor="start">allowPrivilegeEscalation: false · seccompProfile: RuntimeDefault</text><text x="86" y="284" class="ts m" text-anchor="start">resources.requests / limits · tiada privileged · tiada hostPath</text><rect x="620" y="140" width="220" height="90" rx="8" class="acc"/><text x="730.0" y="182.0" class="th" text-anchor="middle">NetworkPolicy</text><text x="730.0" y="200.0" class="ts" text-anchor="middle">deny all, benarkan yang perlu</text><path d="M590,185 H618" class="arr" marker-end="url(#lhh)"/><text x="730" y="262" class="ts" text-anchor="middle">kawal trafik antara pod</text></svg>